<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N-2-13 鐘面的時刻動態探究工具</title>
    <!-- 載入外觀控制工具 (Tailwind CSS) -->
    <script src="https://tailwindcss.com"></script>
    <!-- 載入網頁核心大腦 (React 與 Babel) -->
    <script src="https://unpkg.com" crossorigin></script>
    <script src="https://unpkg.com" crossorigin></script>
    <script src="https://unpkg.com"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <!-- 網頁渲染的起點 -->
    <div id="root"></div>

    <!-- 核心網頁程式碼：修復動畫與時序問題的完美版 -->
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const App = () => {
          const [t, setT] = useState(0); // 動態撥動進度 0 ~ 10
          const [a, setA] = useState(1); // 參數 a: 教學模式 (1: 幾時幾分/五個一數, 2: 兩整時之間的點數)
          const [k, setK] = useState(3); // 參數 k: 起始整點 (1 ~ 12時)
          const [h, setH] = useState(4); // 參數 h: 變動量 (Mode 1: 單位5分鐘, Mode 2: 經過小時)
          const [isPlaying, setIsPlaying] = useState(false);
          
          const maxT = 10;
          const timerRef = useRef(null);

          // 🛠️ 重新改寫最穩定的動畫定時器，徹底解決卡死與動不了的問題
          useEffect(() => {
            if (isPlaying) {
              timerRef.current = setInterval(() => {
                setT((prevT) => {
                  const nextT = prevT + 0.1; // 每次平滑增加進度
                  if (nextT >= maxT) {
                    setIsPlaying(false);
                    return maxT;
                  }
                  return nextT;
                });
              }, 40); // 每 40 毫秒刷新一次，確保動畫極度順暢
            } else {
              if (timerRef.current) clearInterval(timerRef.current);
            }
            
            return () => {
              if (timerRef.current) clearInterval(timerRef.current);
            };
          }, [isPlaying]);

          const handlePlayPause = () => {
            if (t >= maxT) setT(0);
            setIsPlaying(!isPlaying);
          };

          const handleReset = () => {
            setIsPlaying(false);
            setT(0);
          };

          // --- 主圖形 SVG 鐘面坐標轉換 ---
          const svgWidth = 600;
          const svgHeight = 600;
          const originX = 300; // 置中
          const originY = 300; // 置中

          // 計算當前時刻數值
          let currentMinuteValue = 0;
          let currentHourValue = k;
          let currentHourOffset = 0;

          if (a === 1) {
            // 模式 1: 幾時幾分
            const targetMinute = h * 5;
            currentMinuteValue = (t / 10) * targetMinute;
            currentHourValue = k + (currentMinuteValue / 60);
          } else {
            // 模式 2: 整點點數
            currentHourOffset = (t / 10) * h;
            currentHourValue = k + currentHourOffset;
            currentMinuteValue = 0;
          }

          // 取得日常語言溝通意義 (時鐘讀法)
          const getColloquialText = () => {
            if (a === 1) {
              const displayMin = Math.round(currentMinuteValue);
              const displayHour = Math.floor(currentHourValue) % 12 || 12;
              return `${displayHour} 點 ${displayMin === 0 ? "鐘" : `${displayMin} 分`}`;
            } else {
              const startHr = k % 12 || 12;
              const endHr = Math.floor(k + currentHourOffset) % 12 || 12;
              return `從 ${startHr} 點到 ${endHr} 點，經過了 ${Math.floor(currentHourOffset)} 小時`;
            }
          };

          // 決定當前撥動活動的狀態文字與顏色
          const getStatus = () => {
            if (t === 0) return { text: "準備進行鐘面撥動操作", color: "text-gray-600", icon: "○" };
            if (t < maxT) return { text: a === 1 ? "正在撥動分針，觀察五個一數..." : "正在點數整點，觀察時針跳動...", color: "text-blue-500", icon: "➔" };
            return { text: "操作完成！觀察最終指針位置", color: "text-red-500", icon: "●" };
          };

          const currentStatus = getStatus();

          return (
            <div className="min-h-screen bg-gray-100 p-4 font-sans text-gray-800">
              <div className="max-w-6xl mx-auto bg-white rounded-xl shadow-lg overflow-hidden">
                
                {/* Header - 課綱指標核心區域 */}
                <div className="bg-emerald-600 text-white p-6">
                  <div className="flex justify-between items-start flex-wrap gap-2">
                    <div>
                      <h1 className="text-2xl font-bold mb-2">N-2-13 鐘面的時刻動態探究工具</h1>
                      <p className="text-emerald-100 text-lg">
                        以操作活動為主。以鐘面時針與分針之位置認識「幾時幾分」。<br/>
                        含兩整時時刻之間的整時點數（時間加減的前置經驗）。
                      </p>
                    </div>
                    <span className="bg-emerald-800 text-white text-xl font-bold px-4 py-2 rounded-lg shadow-md border border-emerald-500 font-mono">
                      n-I-9
                    </span>
                  </div>
                </div>

                <div className="p-6 flex flex-col gap-6">
                  
                  {/* 上方：控制面板 */}
                  <div className="bg-white rounded-lg border-2 border-gray-200 p-5 shadow-sm w-full">
                    <div className="flex items-center justify-between mb-4 border-b pb-2">
                      <h3 className="text-lg font-bold">互動控制與參數設定</h3>
                      <div className="flex gap-2">
                        <button 
                          onClick={handlePlayPause}
                          className="flex items-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-1.5 rounded-lg font-semibold text-sm transition-colors shadow"
                        >
                          {isPlaying ? (
                            <><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="inline mr-1"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>暫停</>
                          ) : (
                            <><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="inline mr-1"><polygon points="5 3 19 12 5 21 5 3"/></svg>{t >= maxT ? '重新演示' : '自動演示'}</>
                          )}
                        </button>
                        <button 
                          onClick={handleReset}
                          className="flex items-center gap-2 bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-1.5 rounded-lg font-semibold text-sm transition-colors shadow"
                        >
                          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="inline mr-1"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>重置
                        </button>
                      </div>
                    </div>

                    {/* 三個參數調整拉桿 */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-4 border-b pb-4 bg-gray-50 p-4 rounded-lg">
                      <div>
                        <div className="flex justify-between text-sm text-gray-700 font-semibold mb-1">
                          <span>教學模式: {a === 1 ? "幾時幾分 (五個一數)" : "兩整點數 (經過時間)"}</span>
                        </div>
                        <input type="range" min="1" max="2" step="1" value={a} onChange={(e) => { setA(parseInt(e.target.value)); setIsPlaying(false); setT(0); }} className="w-full h-2 bg-gray-300 rounded-lg appearance-none cursor-pointer accent-emerald-600" />
                      </div>
                      <div>
                        <div className="flex justify-between text-sm text-gray-700 font-semibold mb-1">
                          <span>起始時刻: {k} 點鐘</span>
                        </div>
                        <input type="range" min="1" max="12" step="1" value={k} onChange={(e) => { setK(parseInt(e.target.value)); setIsPlaying(false); }} className="w-full h-2 bg-gray-300 rounded-lg appearance-none cursor-pointer accent-emerald-600" />
                      </div>
                      <div>
                        <div className="flex justify-between text-sm text-gray-700 font-semibold mb-1">
                          <span>{a === 1 ? `目標分鐘: ${h * 5} 分` : `目標經過: ${h} 小時`}</span>
                        </div>
                        <input type="range" min="1" max="11" step="1" value={h} onChange={(e) => { setH(parseInt(e.target.value)); setIsPlaying(false); }} className="w-full h-2 bg-gray-300 rounded-lg appearance-none cursor-pointer accent-emerald-600" />
                      </div>
                    </div>

                    {/* 撥動動態進度拉桿 */}
                    <div className="px-2">
                      <div className="flex justify-between text-sm font-medium text-gray-600 mb-2">
                        <span>操作起點</span>
                        <span>撥動進程: <span className="text-emerald-600 text-lg font-bold">{(t * 10).toFixed(0)}%</span></span>
                        <span>目標時刻</span>
                      </div>
                      <input
                        type="range"
                        min="0"
                        max="10"
                        step="0.01"
                        value={t}
                        onChange={(e) => {
                          setT(parseFloat(e.target.value));
                          setIsPlaying(false);
                        }}
                        className="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-emerald-600"
                      />
                    </div>
                  </div>

                  <div className="flex flex-col lg:flex-row gap-6">
                    
                    {/* 左側：主鐘面與指針動態 */}
                    <div className="w-full lg:w-2/3 flex flex-col">
